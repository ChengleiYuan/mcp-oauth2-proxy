name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. latest, next, beta)'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      tag:
        description: 'npm dist-tag'
        type: string
        required: false
        default: 'latest'
    secrets:
      NPM_TOKEN:
        description: 'npm token fallback for repositories not configured for OIDC trusted publishing'
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm (>=11.5.1 required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_call'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          REF="${GITHUB_REF#refs/tags/}"
          echo "Package version: $PKG_VERSION"
          echo "Ref:             $REF"
          if [ "${REF#v}" != "${REF}" ] && [ "$PKG_VERSION" != "$REF" ]; then
            echo "::error::Tag ($REF) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm publish --access public --tag "${TAG:-latest}"
          else
            npm publish --provenance --access public --tag "${TAG:-latest}"
          fi
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
